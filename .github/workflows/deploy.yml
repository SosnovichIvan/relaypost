name: Deploy
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: read
concurrency:
  group: relaypost-production
  cancel-in-progress: false
jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag and current main ancestry
        run: |
          git fetch origin main:refs/remotes/origin/main
          python scripts/check_release.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Full verification before production secrets
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          make check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.12.0'
      - name: Browser acceptance before production secrets
        run: |
          npm ci --prefix web-tests --no-audit --no-fund
          npm run --prefix web-tests e2e
  deploy:
    name: Deploy VPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck immutable release source
        run: |
          git fetch origin main:refs/remotes/origin/main
          python scripts/check_release.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
          python -m pip install -r requirements.lock
      - name: Prepare trusted release and private environment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RELAYPOST_ENCRYPTION_KEY: ${{ secrets.RELAYPOST_ENCRYPTION_KEY }}
          RELAYPOST_ALLOWED_USERS: ${{ secrets.RELAYPOST_ALLOWED_USERS }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          RELAYPOST_LOGIN_ORIGIN: ${{ vars.RELAYPOST_LOGIN_ORIGIN }}
          TELEGRAM_PROXY_URL: http://telegram-proxy:19840
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          git archive --format=tar.gz --output="$RUNNER_TEMP/relaypost.tgz" HEAD Dockerfile requirements.lock relaypost deploy
          export RELAYPOST_ENV_OUTPUT="$RUNNER_TEMP/relaypost.env"
          python -m scripts.build_deploy_env
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Transfer and atomically switch the single poller
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15)
          destination="$VPS_USER@$VPS_HOST"
          checksum=$(sha256sum "$RUNNER_TEMP/relaypost.tgz")
          checksum=${checksum%% *}
          sshpass -e scp "${ssh_opts[@]}" "$RUNNER_TEMP/relaypost.tgz" "$destination:/opt/relaypost/incoming/$GITHUB_REF_NAME.tgz"
          sshpass -e scp "${ssh_opts[@]}" "$RUNNER_TEMP/relaypost.env" "$destination:/opt/relaypost/incoming/$GITHUB_REF_NAME.env"
          sshpass -e scp "${ssh_opts[@]}" deploy/deploy.sh "$destination:/opt/relaypost/incoming/deploy.sh"
          sshpass -e ssh "${ssh_opts[@]}" "$destination" bash /opt/relaypost/incoming/deploy.sh "$GITHUB_REF_NAME" "$checksum"
      - name: Remove runner credential files
        if: always()
        run: rm -f "$RUNNER_TEMP/relaypost.env" "$RUNNER_TEMP/known_hosts"
